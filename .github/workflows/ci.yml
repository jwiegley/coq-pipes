name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run all checks
        run: nix flake check -L

      - name: Build library
        run: nix build -L

  timed-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build with timing
        run: nix build .#timed -L

      - name: Upload timing data
        uses: actions/upload-artifact@v4
        with:
          name: build-timing
          path: result/share/coq-pipes/timing.log
        if: always()

  docs:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build documentation
        run: |
          nix develop -c bash -c "make Makefile.coq && make coq-pipes.pdf"
        continue-on-error: true

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: coq-pipes-pdf
          path: coq-pipes.pdf
        if: success()
